name: Keep Supabase Alive

on:
  schedule:
    # Runs at 12:00 UTC every 3 days
    - cron: '0 12 */3 * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          echo "Pinging Supabase project to prevent auto-pause..."
          if [ -z "$SUPABASE_URL" ]; then
            echo "Missing GitHub secret SUPABASE_URL."
            echo "Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl -sS -X GET "${SUPABASE_URL}/rest/v1/" \
            -H "Content-Type: application/json" \
            --connect-timeout 10 \
            --max-time 30 \
            -w "\nHTTP Status: %{http_code}\n"
          echo "Keep-alive ping completed at $(date)"

      - name: Log completion
        run: echo "✅ Keep-alive job finished successfully"
